services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: maths-backend
    environment:
      - PROGRESS_DB=/data/progress.db
    volumes:
      # named volume keeps progress across rebuilds/restarts
      - progress-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/progress/questions', timeout=3)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: maths-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped

volumes:
  progress-data:
